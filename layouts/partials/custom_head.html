<style>
  .rss-link {
    display: inline-flex;
    align-items: center;
    color: inherit;
    line-height: 1;
    vertical-align: text-bottom;
  }

  .rss-link:hover {
    text-decoration: none;
  }

  .rss-link .svg-icon {
    width: 1rem;
    height: 1rem;
    fill: currentColor;
    flex: none;
  }

  .rss-link .svg-icon.orange {
    color: #f28c28;
  }

  .rss-link:hover .svg-icon.orange {
    color: #e67900;
  }
</style>

<style>
  /* fixing horizontal scroll */
  .highlight, .code {
    overflow-x: auto;
    display: block;
    width: 100%;
  }

  .highlight pre, .code pre {
    width: max-content;
    min-width: 100%;
    margin: 0;
  }
    /* responsive images */
  img {
    max-width: 100%;
    height: auto;
  }

  /* responsive tables */
  table {
    display: block;
    width: 100%;
    overflow-x: auto;
  }
</style>

<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)})();</script>

<style>
  @media (prefers-color-scheme: dark) {
    :root {
      --text-color: #f0f0f0;
      --heading-color: #fff;
      --blockquote-color: #e8e8e8;
    }
  }

  html[data-theme="dark"] {
    --background-color: #01242e;
    --heading-color: #fff;
    --text-color: #f0f0f0;
    --link-color: #8cc2dd;
    --visited-color: #8b6fcb;
    --blockquote-color: #e8e8e8;
  }

  html[data-theme="light"] {
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  #theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: none;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    cursor: pointer;
    font-size: 1rem;
    color: inherit;
    opacity: 0.55;
    z-index: 100;
    line-height: 1;
  }

  #theme-toggle:hover {
    opacity: 1;
  }
</style>
