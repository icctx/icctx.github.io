<style>
  .rss-link {
    display: inline-flex;
    align-items: center;
    color: inherit;
    line-height: 1;
    vertical-align: text-bottom;
  }

  .rss-link:hover {
    text-decoration: none;
  }

  .rss-link .svg-icon {
    width: 1rem;
    height: 1rem;
    fill: currentColor;
    flex: none;
  }

  .rss-link .svg-icon.orange {
    color: #f28c28;
  }

  .rss-link:hover .svg-icon.orange {
    color: #e67900;
  }
</style>

<style>
  /* fixing horizontal scroll */
  .highlight, .code {
    overflow-x: auto;
    display: block;
    width: 100%;
  }

  .highlight pre, .code pre {
    width: max-content;
    min-width: 100%;
    margin: 0;
  }
    /* responsive images */
  img {
    max-width: 100%;
    height: auto;
  }

  /* responsive tables */
  table {
    display: block;
    width: 100%;
    overflow-x: auto;
  }
</style>

<style>
  /* Hello Kitty code theme 🎀 */
  .highlight .chroma,
  .chroma {
    background-color: #f7dfe9;
    color: #3d1228;
    border: 1px solid #f3c2d6;
    border-radius: 10px;
    padding: 14px 16px;
  }

  /* line numbers */
  .chroma .ln,
  .chroma .lnt {
    color: #db6fa3;
    margin-right: 1.1em;
    padding-right: 0.6em;
    border-right: 1px solid #ffc9de;
  }
  .chroma .hl { background-color: #ffe0ec; }

  /* comments */
  .chroma .c, .chroma .ch, .chroma .cm, .chroma .c1, .chroma .cs,
  .chroma .cp, .chroma .cpf {
    color: #b25c8a;
    font-style: italic;
  }

  /* keywords */
  .chroma .k, .chroma .kc, .chroma .kd, .chroma .kn, .chroma .kp,
  .chroma .kr, .chroma .kt, .chroma .nt {
    color: #e91e8c;
    font-weight: bold;
  }

  /* strings */
  .chroma .s, .chroma .s1, .chroma .s2, .chroma .sb, .chroma .sc,
  .chroma .sd, .chroma .se, .chroma .sh, .chroma .si, .chroma .sx,
  .chroma .sr, .chroma .ss, .chroma .dl {
    color: #d6336c;
  }

  /* numbers */
  .chroma .m, .chroma .mb, .chroma .mf, .chroma .mh, .chroma .mi,
  .chroma .mo, .chroma .il {
    color: #e85a96;
  }

  /* functions & builtins */
  .chroma .nf, .chroma .nb, .chroma .bp { color: #c2185b; font-weight: bold; }

  /* classes, decorators, variables — purple accents */
  .chroma .nc, .chroma .nd, .chroma .nn { color: #8e24aa; font-weight: bold; }
  .chroma .nv, .chroma .vc, .chroma .vg, .chroma .vi { color: #9c27b0; }

  /* operators & punctuation */
  .chroma .o, .chroma .ow { color: #b3387a; }
  .chroma .p { color: #a04a72; }

  /* names / attributes */
  .chroma .na { color: #d81b60; }

  /* diff */
  .chroma .gd { color: #c2185b; background-color: #ffe0ec; }
  .chroma .gi { color: #2e7d32; background-color: #e6f7e9; }
</style>

<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)})();</script>

<style>
  /* Input Mono — self-hosted, drop the woff2 files into static/fonts/ */
  @font-face {
    font-family: "Input Mono";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("/fonts/InputMono-Regular.woff2") format("woff2");
  }
  @font-face {
    font-family: "Input Mono";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/fonts/InputMono-Bold.woff2") format("woff2");
  }
  @font-face {
    font-family: "Input Mono";
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url("/fonts/InputMono-Italic.woff2") format("woff2");
  }

  :root {
    --font-scale: 1.1em;
    --width: 960px;
    --font-main: "Input Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-secondary: "Input Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body {
    padding: 20px 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #000;
      --text-color: #f0f0f0;
      --heading-color: #fff;
      --blockquote-color: #e8e8e8;
    }
  }

  html[data-theme="dark"] {
    --background-color: #000;
    --heading-color: #fff;
    --text-color: #f0f0f0;
    --link-color: #8cc2dd;
    --visited-color: #8b6fcb;
    --blockquote-color: #e8e8e8;
  }

  html[data-theme="light"] {
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  #theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: none;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    cursor: pointer;
    font-size: 1rem;
    color: inherit;
    opacity: 0.55;
    z-index: 100;
    line-height: 1;
  }

  #theme-toggle:hover {
    opacity: 1;
  }
</style>
